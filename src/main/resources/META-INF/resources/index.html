<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hobby Tracker</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 640px;
            margin: 40px auto;
            padding: 0 16px;
            color: #222;
        }
        h1 { margin-bottom: 4px; }
        h2, h3 { margin-top: 32px; }

        #global-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        ul#hobby-list {
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .hobby-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .hobby-info { flex: 1; }
        .hobby-title { font-weight: 600; }
        .hobby-meta { font-size: 0.85em; opacity: 0.75; }

        .hobby-status {
            font-size: 0.8em;
            font-weight: 600;
            margin-left: 10px;
        }
        .status-running { color: #1a7f37; }
        .status-stopped { color: #666; }

        .hobby-actions button {
            margin-left: 6px;
            cursor: pointer;
        }

        form {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="text"], input[type="color"] {
            padding: 6px 8px;
        }

        button {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: #f5f5f5;
            cursor: pointer;
        }
        button:hover { background: #eaeaea; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        table#periods-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        #periods-table th, #periods-table td {
            text-align: left;
            padding: 8px 10px;
            border-bottom: 1px solid rgba(0,0,0,0.08);
        }

        #periods-table th {
            font-size: 0.8em;
            text-transform: uppercase;
            opacity: 0.6;
            border-bottom: 2px solid rgba(0,0,0,0.15);
        }

        #periods-table tr:last-child td {
            border-bottom: none;
        }
    </style>
</head>
<body>

<h1>Hobbies</h1>

<div id="global-controls">
    <strong id="global-status">Nothing running</strong>
    <button id="stop-all-btn">Stop current activity</button>
</div>

<ul id="hobby-list">
    <!-- populated by JS -->
</ul>

<h2>Add a Hobby</h2>
<form id="hobby-form">
    <input type="text" id="hobby-title" placeholder="Hobby name" required>
    <input type="text" id="hobby-description" placeholder="Description (optional)">
    <input type="color" id="hobby-color" value="#87ceeb">
    <button type="submit">Add Hobby</button>
</form>

<h3>Recent Periods</h3>
<table id="periods-table">
    <thead>
    <tr>
        <th>Hobby</th>
        <th>Start</th>
        <th>End</th>
        <th>Duration</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody id="periods-body">
    <!-- populated by JS -->
    </tbody>
</table>
<script>
    const hobbyList = document.getElementById('hobby-list');
    const globalStatus = document.getElementById('global-status');

    // --- Load and render everything ---
    async function loadData() {
        const [hobbies, periods] = await Promise.all([
            fetch('/api/hobbies').then(r => r.json()),
            fetch('/api/periods').then(r => r.json())
        ]);

        render(hobbies, periods);
    }

    function render(hobbies, periods) {
        hobbyList.innerHTML = '';

        let anyRunning = false;

        hobbies.forEach(hobby => {
            const hobbyPeriods = periods.filter(p => p.hobby && p.hobby.id === hobby.id);
            const runningPeriod = hobbyPeriods.find(p => p.running);
            const totalMinutes = hobbyPeriods
                .filter(p => p.durationMinutes != null)
                .reduce((sum, p) => sum + p.durationMinutes, 0);

            if (runningPeriod) anyRunning = true;

            const li = document.createElement('li');
            li.className = 'hobby-card';
            li.style.backgroundColor = hobby.color || '#eee';

            li.innerHTML = `
                <div class="hobby-info">
                    <div class="hobby-title">
                        ${escapeHtml(hobby.title)}
                        ${runningPeriod
                ? '<span class="hobby-status status-running">● Running</span>'
                : '<span class="hobby-status status-stopped">○ Stopped</span>'}
                    </div>
                    <div class="hobby-meta">
                        ${hobby.description ? escapeHtml(hobby.description) + ' · ' : ''}
                        Total time: ${totalMinutes} min
                    </div>
                </div>
                <div class="hobby-actions">
                    <button ${runningPeriod ? 'disabled' : ''} onclick="startHobby(${hobby.id})">Start</button>
                    <button onclick="deleteHobby(${hobby.id})">Delete</button>

                </div>
            `;

            hobbyList.appendChild(li);
        });

        globalStatus.textContent = anyRunning ? 'A hobby is currently running' : 'Nothing running';

        renderPeriods(hobbies, periods); // add this line at the end
    }

    let editingPeriodId = null;

    function renderPeriods(hobbies, periods) {
        const periodsBody = document.getElementById('periods-body');
        periodsBody.innerHTML = '';

        const hobbyById = Object.fromEntries(hobbies.map(h => [h.id, h]));

        const recent = [...periods]
            .sort((a, b) => b.id - a.id)
            .slice(0, 20);

        recent.forEach(period => {
            const hobby = period.hobby ? hobbyById[period.hobby.id] : null;
            const tr = document.createElement('tr');
            tr.style.backgroundColor = hobby ? hobby.color : '#eee';

            if (editingPeriodId === period.id) {
                tr.innerHTML = `
                <td>${hobby ? escapeHtml(hobby.title) : 'Unknown'}</td>
                <td><input type="datetime-local" id="edit-start-${period.id}" value="${toInputValue(period.start_time)}"></td>
                <td><input type="datetime-local" id="edit-end-${period.id}" value="${toInputValue(period.end_time)}"></td>
                <td>${period.durationMinutes != null ? period.durationMinutes + ' min' : '—'}</td>
                <td>${period.running ? '● Running' : '○ Stopped'}</td>
                <td>
                    <button onclick="savePeriod(${period.id})">Save</button>
                    <button onclick="cancelEditPeriod()">Cancel</button>
                    <button onclick="deletePeriod(${period.id})">Delete</button>

                </td>
            `;
            } else {
                tr.innerHTML = `
                <td>${hobby ? escapeHtml(hobby.title) : 'Unknown'}</td>
                <td>${formatDateTime(period.start_time)}</td>
                <td>${period.end_time ? formatDateTime(period.end_time) : '—'}</td>
                <td>${period.durationMinutes != null ? period.durationMinutes + ' min' : '—'}</td>
                <td>${period.running
                    ? '<span class="hobby-status status-running">● Running</span>'
                    : '<span class="hobby-status status-stopped">○ Stopped</span>'}</td>
                <td>
                    <button onclick="editPeriod(${period.id})">Edit</button>
                </td>
            `;
            }

            periodsBody.appendChild(tr);
        });
    }

    function editPeriod(id) {
        editingPeriodId = id;
        loadData();
    }

    function cancelEditPeriod() {
        editingPeriodId = null;
        loadData();
    }

    async function savePeriod(id) {
        const startInput = document.getElementById(`edit-start-${id}`).value;
        const endInput = document.getElementById(`edit-end-${id}`).value;

        const body = {
            start_time: startInput || null,
            end_time: endInput || null
        };

        editingPeriodId = null;
        await submitAction(`/api/periods/${id}`, 'Failed to update period', 'PUT', body);
    }

    async function deletePeriod(id) {
        if (!confirm('Delete this period?')) return;
        editingPeriodId = null;
        await submitAction(`/api/periods/${id}`, 'Failed to delete period', 'DELETE');
    }

    function toInputValue(isoString) {
        if (!isoString) return '';
        return isoString.substring(0, 16); // trims to "yyyy-MM-ddTHH:mm" for the input
    }

    function formatDateTime(isoString) {
        if (!isoString) return '—';
        const d = new Date(isoString);
        return d.toLocaleString(undefined, {
            month: 'short', day: 'numeric',
            hour: '2-digit', minute: '2-digit'
        });
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str ?? '';
        return div.innerHTML;
    }

    // --- Actions ---
    async function startHobby(hobbyId) {
        await submitAction(`/api/start/${hobbyId}`, 'Failed to start hobby');
    }

    async function deleteHobby(id) {
        if (!confirm('Delete this hobby?')) return;
        await submitAction(`/api/hobbies/${id}`, 'Failed to delete hobby', 'DELETE');
    }

    document.getElementById('stop-all-btn').addEventListener('click', async () => {
        await submitAction('/api/end', 'Failed to stop activity');
    });

    document.getElementById('hobby-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const title = document.getElementById('hobby-title').value;
        const description = document.getElementById('hobby-description').value;
        const color = document.getElementById('hobby-color').value;

        await submitAction('/api/hobbies', 'Failed to add hobby', 'POST', { title, description, color });

        document.getElementById('hobby-form').reset();
    });

    // --- Shared fetch helper ---
    async function submitAction(url, errorMessage, method = 'POST', body = null) {
        try {
            const response = await fetch(url, {
                method,
                headers: body ? { 'Content-Type': 'application/json' } : undefined,
                body: body ? JSON.stringify(body) : undefined
            });

            if (response.ok) {
                await loadData(); // refresh without a full page reload
            } else {
                alert(errorMessage);
            }
        } catch (err) {
            console.error(err);
            alert(errorMessage);
        }
    }

    // Initial load
    loadData();
</script>

</body>
</html>
