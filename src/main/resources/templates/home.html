<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title></title>
</head>
<body>

<h1>Hobbies</h1>

<ul id="hobby-list">
    {#for hobby in hobbies}
    <li style="background-color:{hobby.color}; padding:4px 8px; border-radius:6px;">
        {hobby.title} ({hobby.description}, created at {hobby.created_at})
    </li>
    {/for}
</ul>

<h2>Add a Hobby</h2>
<form id="hobby-form">
    <label for="hobby"></label><input type="text" id="hobby" placeholder="hobby" required>
    <label for="color"></label><input type="text" id="color" placeholder="Color" required>
    <button type="submit">Add Fruit</button>
</form>

<script>
    document.getElementById('hobby-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const title = document.getElementById('hobby').value;
        const color = document.getElementById('color').value;

        const response = await fetch('/new_hobby', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, color })
        });

        if (response.ok) {
            location.reload(); // simplest way to refresh the list
        } else {
            alert('Failed to add hobby');
        }
    });
</script>

</body>
</html>
